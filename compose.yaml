services:
  roborock-local-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roborock-local-server
    restart: unless-stopped
    ports:
      - "${ROBOROCK_SERVER_HTTPS_PORT:-555}:${ROBOROCK_SERVER_HTTPS_PORT:-555}"
      - "${ROBOROCK_SERVER_MQTT_TLS_PORT:-8881}:${ROBOROCK_SERVER_MQTT_TLS_PORT:-8881}"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./data:/data
      - ./secrets:/run/secrets:ro
    healthcheck:
      # Defaults to https for local_tls. Set ROBOROCK_SERVER_HEALTHCHECK_SCHEME=http
      # when listener_mode = "external_tls" (the server speaks plain HTTP behind the proxy).
      test: ["CMD", "curl", "-skf", "${ROBOROCK_SERVER_HEALTHCHECK_SCHEME:-https}://127.0.0.1:${ROBOROCK_SERVER_HTTPS_PORT:-555}/admin"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Optional TURN relay for camera live view. Start it with:
  #   docker compose --profile camera up -d
  # then set [camera] turn_url/turn_user/turn_password in config.toml. See docs/camera.md.
  coturn:
    image: coturn/coturn:4.6
    container_name: roborock-coturn
    restart: unless-stopped
    profiles: ["camera"]
    # TURN allocates a UDP port per stream, so host networking is the simplest setup.
    network_mode: host
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-port=3478"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--lt-cred-mech"
      - "--fingerprint"
      - "--realm=roborock.local"
      - "--user=${ROBOROCK_TURN_USER:-roborock}:${ROBOROCK_TURN_PASSWORD:-}"
      # For viewing from outside your network, forward UDP/TCP 3478 and UDP 49160-49200
      # to this host and set your public IP:
      # - "--external-ip=${ROBOROCK_TURN_EXTERNAL_IP}"
