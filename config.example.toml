[network]
# The one hostname the stack will serve. Keep this as the hostname only.
stack_fqdn = "api-roborock.example.com"
bind_host = "0.0.0.0"
# Change these if you need custom published ports.
https_port = 555
mqtt_tls_port = 8881
# Optional reverse-proxy support. Leave unset to advertise the listener ports above.
# Set these when a proxy maps public HTTPS/MQTT ports to different backend ports.
# advertised_https_port = 443
# advertised_mqtt_tls_port = 8883
# listener_mode = "local_tls" terminates TLS in the server (default).
# Set "external_tls" only when a reverse proxy terminates TLS and forwards plain
# traffic to the server; the proxy must present a valid cert to clients. See docs/reverse_proxy.md.
# listener_mode = "local_tls"
region = "us"
# Optional timezone returned by the bootstrap location route.
# Defaults to the region default if unset ("Europe/Berlin" for "eu", "America/New_York" for "us",
# "Asia/Shanghai" for "cn", "Europe/Moscow" for "ru").
# timezone = "Europe/Berlin"

[broker]
# Set mode = "external" and host/port to your broker if you do not want embedded Mosquitto.
mode = "embedded"
host = "127.0.0.1"
port = 18830
mosquitto_binary = "mosquitto"
enable_topic_bridge = true

[storage]
data_dir = "/data"

[tls]
# Cloudflare DNS-01 wildcard issuance. No public inbound access is required.
mode = "cloudflare_acme"
base_domain = "example.com"
email = "you@example.com"
cloudflare_token_file = "/run/secrets/cloudflare_token"
renew_days_before = 30
renew_check_seconds = 43200
acme_server = "zerossl"

[admin]
password_hash = "pbkdf2_sha256$600000$replace_me$replace_me"
session_secret = "replace-with-at-least-24-random-characters"
session_ttl_seconds = 86400
protocol_auth_enabled = true
new_connections_enabled = true
# Home Assistant/app logins use this email plus a local 6-digit PIN entered as the "code".
protocol_login_email = "you@example.com"
protocol_login_pin_hash = "pbkdf2_sha256$600000$replace_me$replace_me"

[camera]
# Optional. Camera live view (remote view) streams over WebRTC and needs a TURN relay,
# which the Roborock cloud normally provides. Point this at your own TURN server,
# for example the optional coturn service in compose.yaml. See docs/camera.md.
# turn_url = "turn:192.168.1.10:3478"
# turn_user = "roborock"
# turn_password = "replace-with-a-long-random-password"
# Answer the app's get_turn_server request locally instead of waiting on the robot.
# answer_turn_requests = true
